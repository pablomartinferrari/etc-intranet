# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Recovers the May 2026 Deployment Center workflow (run 26579271957) and adds the
# React SPA build. Vite writes to src/api/wwwroot; `dotnet publish` of src/api
# includes that folder. Production Program.cs serves it with UseDefaultFiles /
# UseStaticFiles and MapFallbackToFile("index.html").
#
# OIDC secret names match the Azure Portal–generated names from that workflow so
# existing repo secrets still work. AZURE_CLIENT_ID / AZURE_TENANT_ID /
# AZURE_SUBSCRIPTION_ID are accepted as a fallback.

name: Build and deploy ASP.Net Core app to Azure Web App - intranet-yfjgdqq7k75by-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Require Vite build variables
        env:
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
        run: |
          : "${VITE_ENTRA_CLIENT_ID:?Set repository variable VITE_ENTRA_CLIENT_ID}"
          : "${VITE_ENTRA_TENANT_ID:?Set repository variable VITE_ENTRA_TENANT_ID}"
          : "${VITE_API_SCOPE:?Set repository variable VITE_API_SCOPE}"

      - name: Build web app
        working-directory: src/web
        env:
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
          VITE_SHAREPOINT_SITE_URL: ${{ vars.VITE_SHAREPOINT_SITE_URL }}
          VITE_FEATURE_AGENTIC_WORKSPACE: ${{ vars.VITE_FEATURE_AGENTIC_WORKSPACE }}
          VITE_ENTRA_REDIRECT_URI: ${{ vars.VITE_ENTRA_REDIRECT_URI }}
        run: |
          npm ci
          # Empty optional vars would override Vite/code fallbacks — drop them.
          [ -z "${VITE_SHAREPOINT_SITE_URL}" ] && unset VITE_SHAREPOINT_SITE_URL
          [ -z "${VITE_FEATURE_AGENTIC_WORKSPACE}" ] && unset VITE_FEATURE_AGENTIC_WORKSPACE
          [ -z "${VITE_ENTRA_REDIRECT_URI}" ] && unset VITE_ENTRA_REDIRECT_URI
          npm run build

      - name: Confirm SPA was written into API wwwroot
        run: |
          test -f src/api/wwwroot/index.html
          test -d src/api/wwwroot/assets

      - name: Run tests
        run: dotnet test src/api.tests/Intranet.Api.Tests.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish src/api/Intranet.Api.csproj -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_31514A164934462F99E8224073D3F887 || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7EBD921FDC0E454C9007D777DE4A3FBE || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_61C45AB3B62641E18FFFB4E3C414D25D || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'intranet-yfjgdqq7k75by-api'
          slot-name: 'Production'
          package: .
